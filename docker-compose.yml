version: '3'
services:
  test-city-backend:
    build: ./data_collector
    image: test-city-backend:latest
    ports:
      - "8000:8000"
    volumes:
      - ./data_collector/data:/usr/src/code-is-beautiful/data_collector/data:rw
    restart: unless-stopped
    depends_on:
      - minio
  minio:
    container_name: Minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=supersecret
    image: quay.io/minio/minio:latest
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - /tmp/minio:/data
    restart: unless-stopped