[project]
name = "code-is-beautiful"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "-", email = "-"},
]
dependencies = [
    "certifi==2022.12.7",
    "charset-normalizer==3.0.1",
    "dictknife==0.14.0",
    "idna==3.4",
    "lizard==1.17.10",
    "numpy==1.24.1",
    "requests==2.28.2",
    "urllib3==1.26.14",
    "GitPython==3.1.31",
    "antlr4-python3-runtime==4.12.0",
]
requires-python = "==3.9.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

[tool.pdm.scripts]
start = "uvicorn data_collector.main:app --host 0.0.0.0 --port 8000 --reload"