<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Viewer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@latest/dist/tailwind.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: linear-gradient(to bottom right, #0f172a, #1e3a8a, #6b21a8);
            color: white;
            min-height: 100vh;
        }
    </style>
    <script src="https://d3js.org/d3.v3.min.js"></script>
    <script type="module" src="main.js"></script>
</head>

<body>
    <header class="bg-black bg-opacity-20 backdrop-blur-sm border-b border-white border-opacity-10">
        <div class="container mx-auto px-6 py-4 flex items-center">
            <a href="../index.html">
                <button class="text-white hover:bg-opacity-10 px-3 py-1 rounded-md">
                    &larr; Back to Projects
                </button>
            </a>
            <div class="mx-auto text-center">
                <h1 class="text-xl font-semibold">Test City (code-is-beautiful)</h1>
                <p class="text-sm text-gray-300">code-city</p>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-4 gap-8">
        <aside class="lg:col-span-1">
            <section class="bg-white bg-opacity-10 backdrop-blur-sm p-4 rounded-lg mb-4">
                <h2 class="text-lg font-semibold mb-2">Controls</h2>
                <div class="grid grid-cols-2 gap-2">
                    <button id="rotate-left"
                        class="text-white bg-transparent hover:bg-white hover:bg-opacity-10 px-3 py-1 rounded transition-colors duration-200">
                        Rotate Left
                    </button>
                    <button id="rotate-right"
                        class="text-white bg-transparent hover:bg-white hover:bg-opacity-10 px-3 py-1 rounded transition-colors duration-200">
                        Rotate Right
                    </button>
                    <button id="rotate-up"
                        class="text-white bg-transparent hover:bg-white hover:bg-opacity-10 px-3 py-1 rounded transition-colors duration-200">
                        Rotate Up
                    </button>
                    <button id="rotate-down"
                        class="text-white bg-transparent hover:bg-white hover:bg-opacity-10 px-3 py-1 rounded transition-colors duration-200">
                        Rotate Down
                    </button>
                    <button id="zoom-in"
                        class="text-white bg-transparent hover:bg-white hover:bg-opacity-10 px-3 py-1 rounded transition-colors duration-200">
                        Zoom In
                    </button>
                    <button id="zoom-out"
                        class="text-white bg-transparent hover:bg-white hover:bg-opacity-10 px-3 py-1 rounded transition-colors duration-200">
                        Zoom Out
                    </button>
                </div>
                <div class="mt-4">
                    <label class="inline-flex items-center space-x-2">
                        <input type="checkbox" id="toggle-bird-eye"
                            class="h-6 w-6 accent-green-500 bg-gray-700 border-gray-500 rounded" />
                        <span class="text-lg text-white select-none">Bird's Eye View</span>
                    </label>
                </div>
                <div class="mt-4">
                    <label class="inline-flex items-center space-x-2">
                        <input type="checkbox" id="toggle-spheres"
                            class="h-6 w-6 accent-green-500 bg-gray-700 border-gray-500 rounded" checked/>
                        <span class="text-lg text-white select-none">Show Mutants</span>
                    </label>
                </div>
               <div class="mt-4">
                    <label class="text-white mb-1 block">House Margin: <span id="margin-value">0.5</span></label>
                    <div class="flex items-center space-x-2">
                        <input id="margin-slider" type="range" min="0" max="1" step="0.001" value="0.5" class="flex-1">
                        <button id="apply-margin" class="px-3 py-1 bg-blue-600 text-white rounded">Apply</button>
                    </div>
                </div>
            </section>
            <section id="project-details" class="bg-white bg-opacity-10 backdrop-blur-sm p-4 rounded-lg">
                <h2 class="text-lg font-semibold mb-2">Project Summary</h2>
                <p id="project-description" class="text-sm text-white">Loading summary...</p>
            </section>            
        </aside>

        <section class="lg:col-span-3 bg-white bg-opacity-5 backdrop-blur-sm p-6 rounded-lg">
            <p>3D Model Viewer</p>
            <div id="code-city-canvas" class="relative w-full aspect-square mt-4">
                <div id="code-city-chart" class="code-city-chart"></div>
                <div id="code-city-legend" class="code-city-legend"></div>
            </div>
        </section>
    </main>
</body>

</html>
