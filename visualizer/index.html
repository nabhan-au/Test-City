<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer Studio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@latest/dist/tailwind.min.css">
    <style>
        body {
            background: linear-gradient(to bottom right, #0f172a, #1e3a8a, #6b21a8);
            color: white;
            min-height: 100vh;
        }
    </style>
</head>

<body>
    <section class="text-center py-20 relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-r from-blue-600 opacity-20 to-purple-600"></div>
        <div class="relative container mx-auto px-6">
            <h1 class="text-5xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">Test City</h1>
            <p class="mt-4 text-xl">Upload, manage, and visualize your 3D models. Experience your designs like never before.</p>
        </div>
    </section>

    <!-- Projects Section -->
    <section class="container mx-auto px-6 py-10">
        <h2 class="text-4xl text-center mb-10">Your Projects</h2>
        <div id="projectList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <p id="defaultMessage" class="col-span-full text-center">No projects available. Upload your first model to
                get started.</p>
        </div>
    </section>

    <!-- Upload Section -->
    <section class="container mx-auto px-6 mt-10 my-20">
      <h2 class="text-4xl font-semibold text-center text-white mb-10">Upload Your Project</h2>

      <div class="bg-white bg-opacity-10 rounded-xl p-8 max-w-2xl mx-auto shadow-lg">
        <form id="uploadForm" enctype="multipart/form-data" class="space-y-6">

          <!-- Project Identifier -->
          <div class="hidden">
            <label for="project_identifier" class="block text-gray-200 text-sm mb-2 font-medium">
              Enter your project identifier
              <span class="text-gray-400">(e.g., <code>apache/commons-lang</code>)</span>
            </label>
            <input
              type="text"
              id="project_identifier"
              name="project_identifier"
              placeholder="e.g., owner/repo-name"
              class="w-full py-3 px-4 rounded-lg bg-white bg-opacity-5 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
          </div>

          <!-- Project Name -->
          <div>
            <label for="project_name" class="block text-gray-200 text-sm mb-2 font-medium">
              Project name
            </label>
            <input
              type="text"
              id="project_name"
              name="project_name"
              placeholder="e.g., project-1"
              class="w-full py-3 px-4 rounded-lg bg-white bg-opacity-5 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
          </div>

          <!-- Folder Upload -->
          <div>
            <label for="folderInput" class="block text-gray-200 text-sm mb-2 font-medium">
              Select your project folder
            </label>
            <input
              type="file"
              id="folderInput"
              name="files"
              webkitdirectory
              directory
              multiple
              class="block w-full py-3 px-4 rounded-lg bg-white bg-opacity-5 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
          </div>

          <!-- Button -->
          <div class="flex justify-center pt-4">
            <button
              type="submit"
              class="bg-blue-500 hover:bg-blue-600 px-8 py-3 rounded-lg text-white font-semibold transition"
            >
              Upload
            </button>
          </div>
        </form>
      </div>
    </section>

    <div id="loadingModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white bg-opacity-90 p-6 rounded-lg flex flex-col items-center">
            <svg class="animate-spin h-8 w-8 text-gray-800" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4l3-3-3-3v4a8 8 0 00-8 8z"></path>
            </svg>
            <p class="mt-2 text-gray-800">Uploading…</p>
        </div>
    </div>

    <script type="module">
        import { fetchProjectList, uploadProject } from "./data/loaders";

        const projectNameInput = document.getElementById("project_name");
        const projectIdentifierInput = document.getElementById("project_identifier");
        projectIdentifierInput.addEventListener("input", () => {
            // Replace "/" with "-" and update the project name field
            const value = projectIdentifierInput.value.trim().replace(/\//g, "-");
            projectNameInput.value = value;
  });

        function addProject(projectName) {
            const defaultMessage = document.getElementById("defaultMessage");
            if (defaultMessage) defaultMessage.remove();

            const projectList = document.getElementById("projectList");
            const projectElement = document.createElement("button");
            projectElement.textContent = projectName;
            projectElement.className = "bg-white bg-opacity-5 rounded-lg p-4 hover:bg-opacity-10";
            projectElement.onclick = () => window.location.href = "./code-city/index.html?project=" + projectName;
            projectList.appendChild(projectElement);
        }

        fetchProjectList()
            .then(list => {
                if (list.length > 0) list.forEach(addProject);
            })
            .catch(() => {
                document.getElementById("projectList")
                    .innerHTML = "<p>Error loading projects.</p>";
            });

        document.getElementById("uploadForm").addEventListener("submit", async e => {
            e.preventDefault();
            const files = document.getElementById("folderInput").files;
            const projectIdentifier = document.getElementById("project_identifier").value.trim();
            const projectName = document.getElementById("project_name").value.trim();


            if (files.length === 0 || !projectName) {
                alert("Please select a folder and enter a project name.");
                return;
            }

            try {
                loadingModal.classList.remove("hidden");
                const result = await uploadProject(projectName, projectIdentifier, files);
                addProject(projectName);
            } catch (err) {
                console.error(err);
                alert("Upload failed");
            } finally {
                loadingModal.classList.add("hidden");
            }
        });
    </script>
</body>

</html>
